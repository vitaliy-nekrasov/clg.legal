<article class="case-card case-card--story">
  <header class="case-card__author">
    <img
      class="case-card__photo"
      src="{{ .photo }}"
      width="70"
      height="70"
      alt=""
      decoding="async"
      loading="lazy"
    />
    <div class="case-card__author-meta">
      <h3 class="case-card__name">{{ .name }}</h3>
      <p class="case-card__role">{{ .role }}</p>
    </div>
  </header>

  <h4 class="case-card__case-title">{{ .title }}</h4>

  <div class="case-card__body">
    <p><strong>{{ .infoLabel }}</strong> {{ .info }}</p>
    <p><strong>{{ .solutionLabel }}</strong> {{ .solution }}</p>
  </div>
</article>
