{{ $partnership := .Params.partnership }}
<section class="partnership" aria-labelledby="partnership-title">
  <div class="partnership__container">
    <div class="partnership__grid">
      <div class="partnership__content">
        <div class="partnership__label">
          <img
            class="partnership__label-icon"
            src="{{ $partnership.labelIcon | relURL }}"
            width="29"
            height="25"
            alt=""
            decoding="async"
          />
        </div>

        <h2 class="partnership__title" id="partnership-title">
          {{ range $partnership.titleLines }}
            <span class="partnership__title-line">{{ . }}</span>
          {{ end }}
        </h2>

        <p class="partnership__description">{{ $partnership.description }}</p>
      </div>

      <aside
        class="partnership__media"
        style="background-image: url('{{ partial "static-url.html" $partnership.card.background }}')"
      >
        <div class="partnership__card">
          <img
            class="partnership__card-icon"
            src="{{ $partnership.card.icon | relURL }}"
            width="28"
            height="25"
            alt=""
            decoding="async"
          />
          <p class="partnership__card-text">{{ $partnership.card.text | safeHTML }}</p>
        </div>
      </aside>
    </div>
  </div>
</section>
